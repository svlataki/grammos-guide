<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammos Adventure Map</title>

<!-- Leaflet CSS for Reliable Tile Rendering -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Google Fonts: Elegant Fantasy Typography with Full Greek Support -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --parchment-bg: #f4e8c1;
  --parchment-dark: #e5d3a1;
  --ink-primary: #2b1e16;
  --ink-muted: #5c4738;
  --gold-accent: #c8963e;
  --crimson-accent: #8b0000;
  --border-gold: #b8860b;
  --shadow-warm: rgba(43, 30, 22, 0.25);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  width: 100%;
  font-family: 'Philosopher', 'Cormorant Garamond', Georgia, serif;
  color: var(--ink-primary);
  background-color: #1a120b;
  overflow: hidden;
}

/* App Container Layout */
.app {
  display: grid;
  grid-template-columns: 380px 1fr;
  height: 100vh;
  width: 100vw;
  position: relative;
}

/* Sidebar styling with aged scroll / parchment aesthetic */
.side {
  background: radial-gradient(circle at center, #f7eed3 0%, #e8d7a7 100%);
  padding: 24px;
  overflow-y: auto;
  border-right: 4px double var(--border-gold);
  box-shadow: 10px 0 30px rgba(0, 0, 0, 0.4);
  z-index: 500;
  display: flex;
  flex-direction: column;
  position: relative;
}

.brand-header {
  text-align: center;
  border-bottom: 2px solid var(--border-gold);
  padding-bottom: 14px;
  margin-bottom: 16px;
}

.brand {
  font-family: 'Cinzel Decorative', 'Cinzel', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--crimson-accent);
  text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
  letter-spacing: 2px;
}

.sub {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-style: italic;
  color: var(--ink-muted);
  font-size: 16px;
  margin-top: 4px;
}

.section-label {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--ink-muted);
  margin: 12px 0 6px 2px;
}

.row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.btn {
  border: 1px solid var(--border-gold);
  background: #fbf5e5;
  color: var(--ink-primary);
  border-radius: 4px;
  padding: 6px 12px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 1px 2px 4px var(--shadow-warm);
}

.btn:hover {
  background: #f0e2b8;
  border-color: var(--crimson-accent);
}

.btn.active {
  background: var(--crimson-accent);
  color: #fcf8ec;
  border-color: #580000;
}

.cards-container {
  flex: 1;
  overflow-y: auto;
  padding-right: 4px;
}

.card {
  border: 1px solid var(--border-gold);
  background: rgba(255, 252, 243, 0.75);
  border-radius: 6px;
  padding: 12px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.2s ease;
}

.card:hover {
  background: #ffffff;
  border-color: var(--crimson-accent);
  transform: translateX(3px);
}

.card.selected {
  border: 2px solid var(--crimson-accent);
  background: #fffdf5;
}

.tag {
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-muted);
}

.title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 16px;
  margin: 4px 0;
  color: var(--ink-primary);
}

.desc {
  font-family: 'Philosopher', serif;
  font-size: 13.5px;
  color: var(--ink-muted);
  line-height: 1.4;
}

.note {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px;
  color: var(--ink-muted);
  margin-top: 14px;
  border-top: 1px dashed var(--border-gold);
  padding-top: 8px;
  text-align: center;
}

/* Map viewport & Leaflet styling */
.map {
  position: relative;
  width: 100%;
  height: 100%;
  background: #2b1e16;
}

#map-container {
  width: 100%;
  height: 100%;
  background-color: #e2d3ab; /* Fallback Parchment Color */
}

/* Sepia/Parchment Filter applied directly to Map Tiles */
.leaflet-tile-pane {
  filter: sepia(0.6) contrast(1.1) brightness(0.95) hue-rotate(-10deg);
}

/* Aged Vignette Overlay Frame */
.map-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 400;
  box-shadow: inset 0 0 70px rgba(43, 30, 22, 0.6), inset 0 0 140px rgba(0, 0, 0, 0.5);
  border: 10px solid transparent;
  border-image: linear-gradient(to bottom right, #b8860b, #5c4738, #2b1e16) 1;
}

.controls {
  position: absolute;
  right: 20px;
  top: 20px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zoom {
  border: 2px solid var(--border-gold);
  background: #fbf5e5;
  color: var(--ink-primary);
  border-radius: 6px;
  width: 40px;
  height: 40px;
  font-family: 'Cinzel', serif;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 2px 4px 10px rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
}

.zoom:hover {
  background: var(--crimson-accent);
  color: #fff;
}

.info-card {
  position: absolute;
  right: 20px;
  bottom: 24px;
  width: min(380px, calc(100% - 40px));
  background: radial-gradient(circle at center, #fcf8ec 0%, #eee0b7 100%);
  padding: 18px;
  border-radius: 8px;
  border: 3px double var(--border-gold);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: none;
  z-index: 500;
}

.info-card.show {
  display: block;
}

.info-card h2 {
  font-family: 'Cinzel', serif;
  color: var(--crimson-accent);
  margin: 6px 0 10px 0;
  font-size: 20px;
}

.info-card .close-btn {
  float: right;
  border: 1px solid var(--border-gold);
  background: #f5e8c7;
  color: var(--ink-primary);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 16px;
  cursor: pointer;
}

.fantasy-pin {
  background: none;
  border: none;
}

@media (max-width: 800px) {
  /* Allow the app to scroll naturally on mobile */
  html, body {
    overflow: auto !important;
  }

  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 350px auto; /* Set fixed height for map, auto height for sidebar */
    height: auto;
    min-height: 100vh;
    overflow: visible;
  }

  /* Keep map fixed at top */
  .map { 
    order: 1; 
    height: 350px; 
  }

  /* Place sidebar below map and let content scroll */
  .side { 
    order: 2; 
    height: auto;
    overflow: visible;
    padding: 16px;
  }

  /* Ensure card container expands properly on small screens */
  .cards-container {
    flex: none;
    height: auto;
    max-height: none;
    overflow: visible;
  }
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand-header">
      <div class="brand">Γράμμος</div>
      <div class="sub">✦ 📜 Χάρτης 4 Ημερών ✦</div>
    </div>

    <div class="section-label">Ημέρες Ταξιδιού</div>
    <div id="days" class="row"></div>

    <div class="section-label">Κατηγορίες</div>
    <div id="cats" class="row"></div>

    <div class="section-label">Σημεία Ενδιαφέροντος</div>
    <div id="cards" class="cards-container"></div>

  </aside>

  <main class="map">
    <div id="map-container"></div>
    <div class="map-vignette"></div>

    <div class="controls">
      <button class="zoom" onclick="zoomBy(1)">+</button>
      <button class="zoom" onclick="zoomBy(-1)">−</button>
      <button class="zoom" onclick="resetView()" style="font-size:14px;">🧭</button>
    </div>

    <div id="info" class="info-card">
      <button class="close-btn" onclick="closeInfo()">×</button>
      <div id="infoBody"></div>
    </div>
  </main>
</div>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="places.js"></script>
<script>
  
let currentDay = 0;
let currentCat = 'Όλα';
let markersGroup = [];
let trailPolyline = null;

const colors = {
  'Ιστορία': '#2f7d4a',
  'Πεζοπορία': '#d97706',
  'Κορυφή': '#b42318',
  'Φαγητό': '#7c3aed',
  'Διαμονή': '#0284c7'
};

function createPinIcon(color, icon) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50" width="36" height="46">
    <path d="M20 0 C9 0 0 9 0 20 C0 32 20 50 20 50 C20 50 40 32 40 20 C40 9 31 0 20 0 Z" fill="${color}" stroke="#b8860b" stroke-width="2"/>
    <circle cx="20" cy="18" r="12" fill="#fcf8ec" stroke="#b8860b" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" text-anchor="middle">${icon}</text>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: 'fantasy-pin',
    iconSize: [36, 46],
    iconAnchor: [18, 46]
  });
}

const center = [
  (40.8284 + 40.0945) / 2,
  (20.6524 + 21.5868) / 2
];

const map = L.map('map-container', {
  center: center,
  zoom: 11,
  zoomControl: false
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const imageBounds = [
  [40.0945, 20.6524], // South-West 
  [40.8284, 21.5868]  // North-East
];
// const imageBounds = [
//   [40.0945, 20.6324], // SW — shifted west
//   [40.8284, 21.5668]  // NE — shifted west
// ];


const customMap = L.imageOverlay(
  'images/grammos-custom-map.png',
  imageBounds,
  {
    opacity: 0.7,
    interactive: false
  }
).addTo(map);

function getFilteredPlaces() {
  return places.filter(p => 
    (currentDay === 0 || p.day === currentDay) &&
    (currentCat === 'Όλα' || p.cat === currentCat)
  );
}

function renderMap() {
  markersGroup.forEach(m => map.removeLayer(m));
  markersGroup = [];

  if (trailPolyline) map.removeLayer(trailPolyline);

  const filtered = getFilteredPlaces();

  filtered.forEach(p => {
    const markerColor = colors[p.cat] || '#8b0000';
    const marker = L.marker([p.lat, p.lon], {
      icon: createPinIcon(markerColor, p.icon)
    }).addTo(map);

    marker.on('click', () => focusLocation(p.id));
    markersGroup.push(marker);
  });

  if (filtered.length >= 2) {
    const latLngs = filtered.map(p => [p.lat, p.lon]);
    trailPolyline = L.polyline(latLngs, {
      color: '#8b0000',
      weight: 3,
      dashArray: '6, 6',
      opacity: 0.8
    }).addTo(map);
  }
}

function renderControls() {
  const daysContainer = document.getElementById('days');
  const catsContainer = document.getElementById('cats');
  const cardsContainer = document.getElementById('cards');

  daysContainer.innerHTML = `<button class="btn ${currentDay === 0 ? 'active' : ''}" onclick="setDay(0)">Όλες</button>` +
    [1, 2, 3, 4].map(d => `<button class="btn ${currentDay === d ? 'active' : ''}" onclick="setDay(${d})">Ημέρα ${d}</button>`).join('');

  const categories = ['Όλα', 'Ιστορία', 'Πεζοπορία', 'Κορυφή', 'Φαγητό', 'Διαμονή'];
  catsContainer.innerHTML = categories.map(c => 
    `<button class="btn ${currentCat === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');

  const filtered = getFilteredPlaces();
  cardsContainer.innerHTML = filtered.map(p => `
    <div class="card" id="card-${p.id}" onclick="focusLocation(${p.id})">
      <div class="tag"><span>Ημέρα ${p.day}</span> • <span>${p.icon} ${p.cat}</span></div>
      <div class="title">${p.name}</div>
      <div class="desc">${p.desc}</div>
    </div>
  `).join('');
}

function setDay(d) {
  currentDay = d;
  renderControls();
  renderMap();
}

function setCategory(c) {
  currentCat = c;
  renderControls();
  renderMap();
}

function focusLocation(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;

  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  const cardEl = document.getElementById(`card-${id}`);
  if (cardEl) {
    cardEl.classList.add('selected');
    cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  map.flyTo([p.lat, p.lon], 13, { duration: 1.2 });

  const info = document.getElementById('info');
  document.getElementById('infoBody').innerHTML = `
    <div class="tag">Ημέρα ${p.day} • ${p.icon} ${p.cat}</div>
    <h2>${p.name}</h2>
    <p class="desc" style="font-size:14px; color:#2b1e16;">${p.desc}</p>
  `;
  info.classList.add('show');
}

function closeInfo() {
  document.getElementById('info').classList.remove('show');
}

function zoomBy(delta) {
  if (delta > 0) map.zoomIn();
  else map.zoomOut();
}

function resetView() {
  map.flyTo([40.35, 20.80], 11);
  closeInfo();
}

renderControls();
renderMap();
</script>
</body>
</html>
