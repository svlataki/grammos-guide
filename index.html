<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grammos Adventure Map</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Your Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand-header">
      <div class="brand">Γράμμος</div>
      <div class="sub">✦ 📜 Χάρτης 4 Ημερών ✦</div>
    </div>

    <div class="section-label">Ημέρες Ταξιδιού</div>
    <div id="days" class="row"></div>

    <div class="section-label">Κατηγορίες</div>
    <div id="cats" class="row"></div>

    <div class="section-label">Σημεία Ενδιαφέροντος</div>
    <div id="cards" class="cards-container"></div>
  </aside>

  <main class="map">
    <div id="map-container"></div>
    <button id="locationButton" onclick="locateUser()" title="Η τοποθεσία μου">📍</button>
    <div class="map-vignette"></div>

    <div class="controls">
      <button class="zoom" onclick="zoomBy(1)">+</button>
      <button class="zoom" onclick="zoomBy(-1)">−</button>
      <button class="zoom" onclick="resetView()" style="font-size:14px;">🧭</button>
    </div>

    <div id="info" class="info-card">
      <button class="close-btn" onclick="closeInfo()">×</button>
      <div id="infoBody"></div>
    </div>
  </main>
</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="places.js"></script>
<script src="app.js"></script>
</body>
</html>
